<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" href="favicon.png">

  <title>Frontend Mentor | Article preview component</title>

  <!--
    - custom css link
  -->
  <link rel="stylesheet" href="style.css">

  <!--
    - google font link
  -->
  <link href="https://fonts.googleapis.com/css?family=Manrope:200,300,regular,500,600,700,800" rel="stylesheet" />

</head>

<body>

  <!--
      - article card
    -->

  <article class="article-card">

    <div class="img-box">
      <img src="Drawers.png" alt="" class="article-banner">
    </div>


    <div class="article-content">

      <a href="#">
        <h3 class="article-title">Transform your living space with simple, stylish upgrades</h3>
      </a>

      <p class="article-text">Ever walked into a space and felt like something was missing? Maybe it seemed a little empty or uninviting. With a few thoughtful touches, you can make any room feel warm and complete.</p>

      <div class="acticle-content-footer">

        <div class="author">
          <img src="avatar.jpg" alt="" class="author-avater">

          <div class="author-info">
            <a href="#">
              <h4 class="author-name">Sophie Reynolds</h4>
            </a>
            <div class="publish-date">23 Sep 2025</div>
          </div>
        </div>


        <div class="share">

          <button class="share-button">
            <ion-icon name="arrow-redo"></ion-icon>
          </button>

          <div class="share-option">
            <span>Share</span>

            <a href="#">
              <ion-icon name="logo-facebook"></ion-icon>
            </a>
            <a href="#">
              <ion-icon name="logo-twitter"></ion-icon>
            </a>
            <a href="#">
              <ion-icon name="logo-pinterest"></ion-icon>
            </a>
          </div>

        </div>

      </div>

    </div>

  </article>






  <!--
    - internal script
  -->
  <script>

    const shareOption = document.querySelector('.share-option');

    document.querySelector('.share-button').addEventListener('click', function () {
      this.classList.toggle('active');
      shareOption.classList.toggle('active');
    });

  </script>

  <!--
    - ionicon link
  -->

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
